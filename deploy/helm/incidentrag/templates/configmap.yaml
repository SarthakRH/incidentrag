apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "incidentrag.fullname" . }}
data:
  QDRANT_URL: {{ .Values.config.qdrantUrl | quote }}
  NEO4J_URI: {{ .Values.config.neo4jUri | quote }}
  NEO4J_USER: {{ .Values.config.neo4jUser | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  EXECUTION_ENABLED: {{ .Values.config.executionEnabled | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  GITHUB_OWNER: {{ .Values.config.githubOwner | quote }}
  GITHUB_REPO: {{ .Values.config.githubRepo | quote }}
  OPENROUTER_BASE_URL: {{ .Values.config.openrouterBaseUrl | quote }}
  OPENROUTER_UTILITY_MODEL: {{ .Values.config.openrouterUtilityModel | quote }}
  OPENROUTER_REASONING_MODEL: {{ .Values.config.openrouterReasoningModel | quote }}
  OPENROUTER_EMBEDDING_MODEL: {{ .Values.config.openrouterEmbeddingModel | quote }}
