{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incidentrag.fullname" . }}-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "incidentrag.name" . }}-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "incidentrag.name" . }}-ui
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          env:
            - name: INCIDENTRAG_API_URL
              value: "http://{{ include "incidentrag.fullname" . }}:{{ .Values.service.port }}"
            - name: INCIDENTRAG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: INCIDENTRAG_API_KEY
          ports:
            - name: http
              containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "incidentrag.fullname" . }}-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "incidentrag.name" . }}-ui
  ports:
    - name: http
      port: 8501
      targetPort: http
{{- end }}
