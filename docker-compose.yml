version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# IncidentRAG — Local Development Stack
# Start: docker compose up -d
# Stop:  docker compose down
# Wipe:  docker compose down -v
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Neo4j ── graph database for service-dependency and runbook relations ──
  neo4j:
    image: neo4j:5.15
    container_name: incidentrag-neo4j
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/incidentrag
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1g"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Qdrant ── vector database for dense retrieval ─────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: incidentrag-qdrant
    ports:
      - "6333:6333"   # HTTP REST + gRPC
      - "6334:6334"   # gRPC (alternative)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Redis ── caching, feedback queue, rate-limit counters ─────────────────
  redis:
    image: redis:7-alpine
    container_name: incidentrag-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── OpenTelemetry Collector ── traces + metrics ────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: incidentrag-otel
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics (self-monitoring)
      - "8889:8889"   # Prometheus exporter
    volumes:
      - ./configs/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  # ── IncidentRAG API ── main FastAPI application ───────────────────────────
  incidentrag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incidentrag-api
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    profiles:
      - app   # Only started when explicitly requested: docker compose --profile app up

  # ── IncidentRAG UI ── Streamlit approval dashboard ────────────────────────
  incidentrag-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: incidentrag-ui
    ports:
      - "8501:8501"
    depends_on:
      - incidentrag-api
    env_file:
      - .env
    restart: unless-stopped
    profiles:
      - app   # Only started when explicitly requested: docker compose --profile app up

volumes:
  neo4j_data:
  qdrant_data:
  redis_data:
